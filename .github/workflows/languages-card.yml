name: Languages Card

on:
  schedule:
    - cron: "0 7 * * *" # daily, 3am Eastern
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/languages-card.ts "${{ github.repository_owner }}" assets/languages-card.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages-card.svg
          git diff --cached --quiet || { git commit -m "Update languages card"; git push; }
